[package]
name = "prompts-wallet"
version = "0.1.0"
edition = "2024"
description = "A fast, local-first prompt wallet for the terminal"
license = "MIT"
repository = "https://github.com/marcykay404/prompts-wallet"

[[bin]]
name = "pwt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.21"
